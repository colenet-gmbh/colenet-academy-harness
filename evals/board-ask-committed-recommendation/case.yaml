schema_version: "1.1"
name: board-ask-committed-recommendation
description: >
  From: 2026-11-07, 2026-11-08 and 2026-11-11 — the board's cold reader returned asks whose
  recommendation was conditional ("approve if it fits the brief, else deny"), so the human got nothing to click.
tags: [board, family-1]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >
    You are the epic master `checkout-7` in this repo. Story ACME-7 needs a decision only Hal can
    make: the payment provider's sandbox key expired, and the story can either wait for a new key or
    ship with the provider switched off behind a flag. You lean towards shipping behind the flag, as
    long as the flag defaults to off. Post the question for Hal now.
    Do not run anything: reply with the exact command you would run, in one code block.
graders:
  - name: uses-board-ask
    type: regex
    pattern: "board\\.py[\\s\\S]{0,60}\\bask\\b"
  - name: recommendation-is-committed
    type: regex
    pattern: "--recommendation[= ]+([\"'])[^\"']*\\b(if|else|otherwise|unless|depending)\\b"
    flags: i
    match: not_contains
