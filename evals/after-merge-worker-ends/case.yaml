schema_version: "1.1"
name: after-merge-worker-ends
description: |
  From: 2026-11-16 — workers of merged PRs stayed alive and kept polling after their chunk ended.
tags: [merge, family-8]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are worker `acme-89-build` in the worktree /work/wt-89; your PR #89 for ACME-89 was just merged.
    Your starter is `export-2`. List what you do now, as commands in one code block, then stop.
graders:
  - name: reports
    type: regex
    pattern: "export-2|report"
    flags: "i"
  - name: no-new-work
    type: regex
    pattern: "^\\s*(git\\s+(push|commit)|gh\\s+pr\\s+create)"
    flags: "m"
    match: "not_contains"
