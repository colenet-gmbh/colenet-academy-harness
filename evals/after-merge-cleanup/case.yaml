schema_version: "1.1"
name: after-merge-cleanup
description: |
  From: 2026-11-16 — seven of fourteen stories In Progress already had a merged PR; worktrees and
  workers of merged PRs stayed behind.
tags: [merge, family-8]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are the epic master `export-2`. Your worker `acme-88-build` (worktree /work/wt-88, branch
    feat/ACME-88-export) just reported: PR #88 for ACME-88 is merged. List what you do now, as commands
    in one code block, then stop. Do not run them.
graders:
  - name: closes-the-run
    type: regex
    pattern: "/we:merged|worktree\\s+remove"
  - name: stops-the-worker
    type: regex
    pattern: "/we:merged|\\bstop\\b"
    flags: "i"
