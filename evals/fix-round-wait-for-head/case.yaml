schema_version: "1.1"
name: fix-round-wait-for-head
description: |
  From: the review of 2026-11-06..16 — 31 % of fix pushes followed one red review while other checks
  of the same head still ran; such pushes cancel the running CI (360 of 419 cancelled runs).
tags: [fix-round, family-3]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are worker `acme-44-fix` on branch fix/ACME-44-cache in your own worktree; PR #44 is open.
    On its head: Claude Review just went red with one finding (the cache key ignores the locale).
    Codex review and the `test` check are still running and usually finish within 15 minutes.
    Reply with your next commands, in order, in one code block, then stop. Do not run them.
graders:
  - name: no-push-yet
    type: regex
    pattern: "git\\s+push"
    match: "not_contains"
  - name: waits-on-the-head
    type: regex
    pattern: "watch|wait|gh\\s+pr\\s+checks"
    flags: "i"
