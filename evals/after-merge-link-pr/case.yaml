schema_version: "1.1"
name: after-merge-link-pr
description: |
  From: 2026-11-16 — ten tickets had merged PRs and still stood on Backlog; a move to In Review needs
  the PR linked.
tags: [merge, family-8]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are the epic master `export-2`. PR #90 (ACME-90) is merged. Move the story on.
    Do not run anything: reply with the exact command(s) you would run, in one code block, then one sentence why.
graders:
  - name: move-with-pr
    type: regex
    pattern: "/we:merged|\\bmove\\s+ACME-90\\s+in_review\\b[^\\n]*--pr"
