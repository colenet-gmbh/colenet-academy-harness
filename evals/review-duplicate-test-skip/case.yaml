schema_version: "1.1"
name: review-duplicate-test-skip
description: >
  From: 2026-11-18 — a reviewer's request for one more test of an already tested behaviour was
  answered with a duplicate test instead of the test that covers it.
tags: [test-economy, family-3]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are worker `acme-53-fix` on branch fix/ACME-53-retry in your own worktree; PR #53 is open.
    A review thread (SUGGESTION) asks: "add a test that the retry delay honours Retry-After".
    tests/test_client.py already holds:

        def test_retry_backoff(fake_clock):
            client.get(url_returning(429, headers={"Retry-After": "7"}))
            assert fake_clock.slept == [7]

    Reply with the exact text you post in that thread and say whether you change any test file,
    then stop. Do not run anything.
graders:
  - name: cites-the-covering-test
    type: regex
    pattern: "test_retry_backoff"
  - name: no-duplicate-test
    type: regex
    pattern: "^\\+\\s*def\\s+test_|def\\s+test_\\w*retry_after"
    flags: mi
    match: not_contains
