schema_version: "1.1"
name: brief-without-plan-path
description: |
  From: 2026-11-17 — the brief check had refused 270 briefs for a missing "Tools and sources"
  section; a worker on a brief without a plan path guesses the scope.
tags: [brief, family-5]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Brief from your starter `export-2`:

    ## Goal
    Build the CSV export for ACME-77.
    ## Output
    One PR against main.
    ## Tools and sources
    Your tree is the current directory.
    ## Limits and when to stop
    No version bump.

    There is no file under docs/plans/. Reply with what you do next, in at most four lines.
graders:
  - name: asks-the-starter
    type: regex
    pattern: "export-2|starter|sender"
    flags: "i"
  - name: does-not-build
    type: regex
    pattern: "git\\s+commit|gh\\s+pr\\s+create"
    match: "not_contains"
