schema_version: "1.1"
name: board-ask-two-decisions
description: |
  From: 2026-11-14 and 2026-11-17 — the board's cold reader returned asks that carried two decisions
  in one question ("delete the account and answer the user"; "merge and skip the finding").
tags: [board, family-1]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are the epic master `account-3`. For ACME-31 two things need Hal: whether to delete the test
    account `demo-7` that a customer reported, and whether to answer that customer by email today. You
    recommend yes to both. Put this in front of Hal now.
    Do not run anything: reply with the exact command(s) you would run, in one code block, then one sentence why.
graders:
  - name: two-asks
    type: regex
    pattern: "board\\.py[^\\n]*\\bask\\b"
    match: "count:2"
  - name: no-two-in-one-ask
    type: regex
    pattern: "--ask[= ]+[\\\"'][^\\\"']*\\bdelete\\b[^\\\"']*\\b(answer|reply|email)\\b"
    flags: "i"
    match: "not_contains"
