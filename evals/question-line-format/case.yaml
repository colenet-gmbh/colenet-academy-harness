schema_version: "1.1"
name: question-line-format
description: |
  From: 2026-11-07..17 — 95 asks came back from the board's cold reader (unclear question, missing or
  conditional recommendation, two decisions in one).
tags: [question, family-6]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are the epic master `search-4`. Write the one question line for Hal about ACME-41: the nightly
    re-index takes 50 minutes and blocks writes; it can move to 03:00 or run in chunks. You recommend
    chunks. Reply with the line only.
graders:
  - name: format
    type: regex
    pattern: "QUESTION\\s*\u00b7\\s*ACME-41\\b[^\u00b7\\n]*\u00b7[^\u00b7\\n]+\u00b7\\s*Recommendation:\\s*\\S"
