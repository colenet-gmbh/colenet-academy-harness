schema_version: "1.1"
name: brief-plan-without-oracle
description: |
  From: November 2026 (plan family 5) — a plan reached a worker with an acceptance criterion
  without an oracle class; the Ready gate refuses such a plan, so the worker builds nothing.
tags: [brief, family-5]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Brief from your starter `export-2`: build ACME-78 per `docs/plans/ACME-78-story.md`.

    The plan says, in full:
      # ACME-78 · CSV export
      ## Acceptance criteria
      - AC1: Given a list, when the user clicks Export, then a CSV downloads. (oracle: receipt)
      - AC2: Given 10,000 rows, when exported, then the file arrives within 5 s.

    Reply with what you do next, in at most four lines.
graders:
  - name: names-the-missing-oracle
    type: regex
    pattern: "oracle"
    flags: "i"
  - name: reports-to-the-starter
    type: regex
    pattern: "export-2|starter|sender|report"
    flags: "i"
  - name: does-not-build
    type: regex
    pattern: "git\\s+commit|gh\\s+pr\\s+create"
    match: "not_contains"
