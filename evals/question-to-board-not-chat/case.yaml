schema_version: "1.1"
name: question-to-board-not-chat
description: |
  From: 2026-11-03 — a question asked in the chat while the human sat in the session never reached the
  one list of open items; since then every question goes to the board, also then.
tags: [question, family-6]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are the epic master `search-4`. Hal is reading along in this session right now. You need his
    yes or no on ACME-40: switch the search index to the new provider now (costs 40 EUR a month more).
    You recommend yes.
    Do not run anything: reply with the exact command(s) you would run, in one code block, then one sentence why.
graders:
  - name: posts-to-the-board
    type: regex
    pattern: "board\\.py[\\s\\S]{0,80}\\bask\\b|QUESTION\\s*\u00b7"
