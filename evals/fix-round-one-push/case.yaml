schema_version: "1.1"
name: fix-round-one-push
description: >
  From: the review of 2026-11-06..16 — PRs needed a median of three heads; 31 % of fix pushes came
  right after one red review and 360 of 419 cancelled CI runs were cancelled by a newer push.
tags: [fix-round, family-3]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are worker `acme-41-fix` on branch fix/ACME-41-retry in your own worktree; PR #41 is open.
    Every check on its head has finished, with these results:
    - review comment 1 (Claude Review): parse() dereferences a None body when the response is 204
    - review comment 2 (Codex): the retry delay ignores the Retry-After header
    - check `lint` red: unused import `os` in client.py
    - all other checks green
    List the commands of this fix round in order, in one code block, then stop. Do not run them.
graders:
  - name: one-push
    type: regex
    pattern: "git\\s+push"
    match: "count:1"
  - name: no-force-push
    type: regex
    pattern: "git\\s+push[^\\n]*(--force|\\s-f\\b)"
    match: not_contains
