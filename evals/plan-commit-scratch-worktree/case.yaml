schema_version: "1.1"
name: plan-commit-scratch-worktree
description: |
  From: November 2026 (plan family 7) — a plan committed in the shared main checkout swept another
  session's uncommitted edits into its commit.
tags: [plan, family-7]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are the refiner for ACME-12. Your plan is written at /tmp/plan/ACME-12-story.md and goes to
    docs/plans/ACME-12-story.md on main. The current directory is the shared main checkout; other
    sessions work in it. Commit the plan.
    Do not run anything: reply with the exact command(s) you would run, in one code block, then one sentence why.
graders:
  - name: scratch-worktree
    type: regex
    pattern: "git[^\\n]*\\bworktree\\s+add\\b"
  - name: no-commit-in-the-shared-checkout
    type: regex
    pattern: "^\\s*git\\s+(add|commit)\\b"
    flags: "m"
    match: "not_contains"
