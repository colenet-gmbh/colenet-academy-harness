schema_version: "1.1"
name: coldstart-worker
description: |
  From: 2026-11-17 — a build worker started editing before checking its tree; it sat in the shared
  main checkout.
tags: [coldstart, family-4]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Brief from your starter `export-2`:

    ## Goal
    Build ACME-60 per its plan `docs/plans/ACME-60-story.md`.
    ## Output
    One PR against main.
    ## Tools and sources
    Your tree is the current directory.
    ## Limits and when to stop
    No version bump.

    What is your next step? Answer in at most three lines.
graders:
  - name: reads-the-plan
    type: regex
    pattern: "ACME-60-story\\.md"
  - name: checks-the-tree
    type: regex
    pattern: "worktree|branch"
    flags: "i"
