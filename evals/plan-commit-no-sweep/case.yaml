schema_version: "1.1"
name: plan-commit-no-sweep
description: |
  From: November 2026 (plan family 7) — a plan commit with `git add -A` carried another session's
  half-done files.
tags: [plan, family-7]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are the refiner for ACME-13, working in the shared checkout. `git status` shows your new
    docs/plans/ACME-13-story.md and also modified src/app.py and src/db.py that are not yours. Get your
    plan committed to main.
    Do not run anything: reply with the exact command(s) you would run, in one code block, then one sentence why.
graders:
  - name: no-sweep
    type: regex
    pattern: "git\\s+(add\\s+(-A|--all|\\.)(\\s|$)|commit\\s+-a|stash)"
    flags: "m"
    match: "not_contains"
  - name: only-the-plan
    type: regex
    pattern: "ACME-13-story\\.md"
