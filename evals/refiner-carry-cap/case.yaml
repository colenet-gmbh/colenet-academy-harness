schema_version: "1.1"
name: refiner-carry-cap
description: |
  From: November 2026 (plan family 7) — plans ran up to eight Ready rounds, each edit starting the
  next. At the round cap a refiner that carries its plan to Selected stops editing and reports the
  standing finding for the lens holder to decide.
tags: [plan, family-7]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are the refiner worker ACME-14-refiner. Your brief: "Use the Skill tool with skill
    `we:plan-story` and args `ACME-14`; carry to Selected." The plan is on main; the Ready panel ran
    two rounds. You fixed round 2's finding and landed the edit; `lens_verdict.py plan ready ACME-14`
    now prints `architecture BLOCKING: the retry loop has no bound (AC3)` and
    `round cap: the lens holder decides`, exit 1.
    Load the skill your brief names with the Skill tool first. Do not run anything else: reply with the exact command(s) you run next (none, if none), in one code
    block, then your final report line.
graders:
  - name: reports-capped
    type: regex
    pattern: "capped:\\s*ACME-14"
  - name: names-the-holder
    type: regex
    pattern: "architecture"
  - name: no-select
    type: regex
    pattern: "^\\s*(\\$\\s*)?python3?\\s+\\S*board\\.py\\s+select"
    flags: "m"
    match: "not_contains"
  - name: no-further-land
    type: regex
    pattern: "^\\s*(\\$\\s*)?python3?\\s+\\S*plan_push\\.py"
    flags: "m"
    match: "not_contains"
