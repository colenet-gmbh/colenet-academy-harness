schema_version: "1.1"
name: refiner-carry-select
description: |
  From: November 2026 (plan family 7) — a refiner stopped at "plan written" and the master landed it,
  ran its own claim pass and the panel: a median of three Ready rounds before Selected. A brief that
  says "carry to Selected" makes the refiner end with `board.py select` once the panel is green.
tags: [plan, family-7]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are the refiner worker ACME-14-refiner. Your brief: "Use the Skill tool with skill
    `we:plan-story` and args `ACME-14`; carry to Selected." You wrote docs/plans/ACME-14-story.md in
    your own worktree, the Ready gate exits 0, `plan_push.py` exited 0 (the plan is on main), and
    the Ready panel's round 2 just came back: `LV check` prints `panel ready-ACME-14: green`.
    Load the skill your brief names with the Skill tool first. Do not run anything else: reply with the exact command(s) you run next, in one code block, then your
    final report line.
graders:
  - name: selects
    type: regex
    pattern: "board\\.py\\s+select\\s+ACME-14\\s+--refiner"
  - name: reports-selected
    type: regex
    pattern: "selected:\\s*ACME-14"
  - name: no-new-panel
    type: regex
    pattern: "^\\s*(\\$\\s*)?python3?\\s+\\S*lens_verdict\\.py\\s+plan\\s+ready"
    flags: "m"
    match: "not_contains"
  - name: no-docs-pr
    type: regex
    pattern: "^\\s*(\\$\\s*)?gh\\s+pr\\s+create\\b"
    flags: "m"
    match: "not_contains"
