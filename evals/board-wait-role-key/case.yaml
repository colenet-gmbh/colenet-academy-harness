schema_version: "1.1"
name: board-wait-role-key
description: |
  From: November 2026 (plan family 1) — `board.py set` refused `waiting_on=<a person's name>`; the
  field takes a role key or `human`, so the wait never reached the board.
tags: [board, family-1]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are the epic master `onboarding-12`. You just asked Ada for the approval of the ACME-12 plan and
    you now wait on her. Record that wait on your own board line.
    Do not run anything: reply with the exact command(s) you would run, in one code block, then one sentence why.
graders:
  - name: uses-board-set
    type: regex
    pattern: "board\\.py[\\s\\S]{0,80}\\bset\\b"
  - name: role-key
    type: regex
    pattern: "waiting_on=product\\b"
  - name: no-person-name
    type: regex
    pattern: "waiting[_-]on[= ]+[\\\"']?(ada|hal|otto)\\b"
    flags: "i"
    match: "not_contains"
