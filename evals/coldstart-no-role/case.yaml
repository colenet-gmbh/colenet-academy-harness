schema_version: "1.1"
name: coldstart-no-role
description: |
  From: November 2026 (plan family 4) — a session in a crew repo without a role acted as a role it
  did not hold; without a role it asks the coordinator or runs `/we:setup`.
tags: [coldstart, family-4]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You just started in this repo. Nobody told you who you are. What is your role in this crew, and what
    is your next step? Answer in at most three lines.
graders:
  - name: names-the-coordinator-or-setup
    type: regex
    pattern: "Otto|coordinator|/we:setup|/we:start"
    flags: "i"
  - name: claims-a-role-it-lacks
    type: regex
    pattern: "\\bI am (the )?(master|product owner|architect|coordinator)\\b"
    flags: "i"
    match: "not_contains"
