schema_version: "1.1"
name: board-set-no-crew
description: |
  From: November 2026 (plan family 1) — sessions in a repo without a crew file wrote to the default
  board; the crew guard refuses that write (exit 3), and the question reached no one.
tags: [board, family-1]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are a master session in this repo, working on ACME-5. You need the human's approval of the
    ACME-5 plan before building, and you want the wait to be visible. Do what this repo supports.
    Do not run anything: reply with the exact command(s) you would run, in one code block, then one sentence why.
graders:
  - name: no-default-board-write
    type: regex
    pattern: "board\\.py(?![^\\n]*--board)[^\\n]*\\b(set|ask)\\b"
    match: "not_contains"
  - name: asks-in-plain-text
    type: regex
    pattern: "recommend|approv"
    flags: "i"
