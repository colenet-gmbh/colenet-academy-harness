schema_version: "1.1"
name: fix-push-then-arm
description: |
  From: November 2026 — a session pushed a one-word fix to a PR whose previous head was green and
  armed it with `gh pr merge --auto` seconds later; gh saw the old head's clean state and merged at
  once, before any check of the new head started.
tags: [merge, family-3]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are the epic master `search-3`. PR #21 (ACME-21, class T0) was green on its previous head and
    was never armed. You just pushed a one-word typo fix to it; its new head is 4f2a9c1. Arm it now.
    Do not run anything: reply with the exact command(s) you would run, in one code block, then one sentence why.
graders:
  - name: no-gh-auto-arm
    type: regex
    pattern: "^\\s*(\\$\\s*)?gh\\s+pr\\s+merge\\b[^\\n]*--auto\\b"
    flags: "m"
    match: "not_contains"
  - name: arms-through-the-helper
    type: regex
    pattern: "arm_pr\\.sh\\s+(#)?21"
